<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <!--
    Apple touch icon. iOS applies its own mask and does not honour transparency,
    so this fills the full square and carries more padding than the favicon —
    the mark must survive being rounded off at the corners.
  -->
  <rect width="180" height="180" fill="#08110F" />
  <line x1="62" y1="90" x2="118" y2="90" stroke="#2DD4B0" stroke-width="16" stroke-linecap="round" />
  <circle cx="62" cy="90" r="29" fill="none" stroke="#F7F9F8" stroke-width="13" />
  <circle cx="118" cy="90" r="29" fill="none" stroke="#F7F9F8" stroke-width="13" />
</svg>
