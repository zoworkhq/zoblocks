<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    O₂ — two bonded atoms, the same mark as the header logo.

    Deliberately reversed out of a dark tile rather than drawn on transparent:
    a favicon sits on browser chrome that may be light or dark, and a hairline
    outline mark disappears at 16px. Solid ground keeps it legible either way,
    and the bond is the only element that carries brand colour.
  -->
  <rect width="32" height="32" rx="7" fill="#08110F" />
  <line x1="11" y1="16" x2="21" y2="16" stroke="#2DD4B0" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="11" cy="16" r="5.25" fill="none" stroke="#F7F9F8" stroke-width="2.75" />
  <circle cx="21" cy="16" r="5.25" fill="none" stroke="#F7F9F8" stroke-width="2.75" />
</svg>
