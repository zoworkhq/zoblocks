# Software Bill of Materials.
#
# Healthcare procurement asks for one, increasingly as a contract term. It is
# cheap to produce and expensive to be without at the moment a customer asks.
# Generated on every release and attached to the GitHub release.

name: SBOM

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: Generate and attach
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          pnpm dlx @cyclonedx/cyclonedx-npm@latest \
            --output-format JSON \
            --output-file sbom.cyclonedx.json \
            --omit dev \
            --spec-version 1.5

      - name: Summarise
        run: |
          set -euo pipefail
          count=$(node -e 'process.stdout.write(String((require("./sbom.cyclonedx.json").components||[]).length))')
          echo "### SBOM generated" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$count\` runtime components, CycloneDX 1.5." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cyclonedx.json
          retention-days: 90

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" sbom.cyclonedx.json --clobber
