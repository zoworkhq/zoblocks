name: Migrate hq database

# Deliberately manual, and deliberately not part of deploy.
#
# A schema change that runs automatically on merge takes the app down with no
# one watching and no decision point. Deploys are frequent and reversible;
# migrations are neither. Running this is a thing a person chooses to do, with
# the deploy already green.
#
# Order matters: apply an additive migration BEFORE deploying code that needs
# it, and a destructive one AFTER the code that stopped using the old shape.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "migrate" to confirm you intend to alter the production schema'
        required: true
        type: string

concurrency:
  group: migrate-hq
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply pending migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production-hq

    steps:
      - name: Check confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "migrate" ]; then
            echo "::error::Not confirmed. Re-run and type migrate in the confirmation field."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Printed before anything is applied, so the run log records what the
      # schema was about to become — the thing you want when a migration is
      # the suspect an hour later.
      - name: Show pending migrations
        run: ls -1 apps/hq/drizzle/*.sql

      - name: Migrate
        working-directory: apps/hq
        env:
          DATABASE_URL: ${{ secrets.HQ_DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::HQ_DATABASE_URL is not set. Add it under Settings → Secrets → Actions."
            exit 1
          fi
          pnpm db:migrate
