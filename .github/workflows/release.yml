name: Release

# Publishing is separate from deploying on purpose. The site can ship many
# times a day; an npm release changes what every existing consumer resolves to
# and should happen when someone decided it would, not as a side effect of
# merging.
#
# Changesets makes that decision explicit: a PR carrying a changeset opens a
# "Version packages" PR, and merging *that* publishes. A PR with no changeset
# publishes nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

# Git hooks are for humans.
#
# `prepare: husky` installs them on every `pnpm install`, including here, so a
# commit made by this workflow runs `lint-staged` and `commitlint` — checks
# written for hand-authored commits, re-running work the pipeline has already
# done. The Version commit is generated by changesets and its message is fixed
# by that convention, so commitlint rejected it outright:
#
#     subject may not be empty [subject-empty]
#     type may not be empty [type-empty]
#     husky - commit-msg script failed (code 1)
#
# HUSKY=0 stops them installing at all. Nothing is lost: every gate those hooks
# run is a gate this workflow runs directly, against the whole repository
# rather than against staged files.
env:
  HUSKY: 0

permissions:
  contents: write
  pull-requests: write
  # Required for npm provenance. It is what lets npm attest that the tarball
  # was built from this repository at this commit — worth having anywhere, and
  # worth more on a package whose pitch is that you can audit every line.
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      # Releases used to run strictly fewer gates than merges — no lint, no
      # typecheck, no format, no generator drift check, and no dependency on CI
      # having passed, so a commit with red CI could publish to npm. Publishing
      # is the most irreversible thing this repository does; it now runs at
      # least what a merge runs.
      #
      # The published artifact is also built here rather than taken on trust. A
      # local rehearsal once found the test suite inside the tarball and dist
      # emitting extensionless imports that threw in plain Node — neither of
      # which typecheck or `npm publish --dry-run` noticed.
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Generate and enforce the catalog quality gate
        run: pnpm gen --strict

      - name: No stale generated files
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::Generated files are stale. Run \`pnpm gen\` and commit the result."
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # Guards against the failure that shipped 0.1.0: a package whose
      # publishConfig points at ./dist while dist does not contain what it
      # claims, or contains things it should not.
      #
      # Every publishable package is inspected, not just the first one that
      # ever needed it. This used to name packages/fhir directly, so a second
      # package could be published with none of these checks run against it.
      - name: Inspect every tarball before publishing
        run: |
          set -euo pipefail
          failed=0
          for pkg in packages/*/; do
            if [ -f "${pkg}scripts/check-tarball.mjs" ]; then
              echo "── ${pkg}"
              (cd "$pkg" && node scripts/check-tarball.mjs) || failed=1
            fi
          done
          exit $failed

      # The four inputs below were renamed by changesets/action, and the action
      # hard-errors on the old spellings rather than falling back — so this step
      # failed on every push to main, which is every merge. Nothing was
      # published and no "Version packages" PR was opened; the failure is at the
      # end of a long green job, which is why it read as noise for a while.
      #
      # Worth noting for next time: the rename shipped inside the `v2` tag we
      # pin to, so pinning a major is not the protection it looks like. A digest
      # pin would have held. Left as a tag to match every other action in this
      # repository — changing that is its own decision, not a drive-by.
      #
      # `RELEASE_PAT` is optional and exists for one reason: opening the
      # "Version packages" PR needs a permission the workflow cannot grant
      # itself. The `pull-requests: write` above is necessary and not
      # sufficient — a repository switch, Settings -> Actions -> General ->
      # Workflow permissions -> "Allow GitHub Actions to create and approve
      # pull requests", overrides it. While that is off, the action versions
      # every package correctly and then fails on the final call with
      # "GitHub Actions is not permitted to create or approve pull requests".
      #
      # Enabling the switch is the simpler fix and stores no credential. The
      # PAT is for a repository that keeps the switch off on purpose: a token
      # belonging to a person rather than to the run.
      - name: Version PR or publish
        id: changesets
        # Allowed to fail so the fallback below can run. The fallback re-fails
        # the job for anything that is not the PR-permission case, so a broken
        # publish is still a broken build.
        continue-on-error: true
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2 branch head
        with:
          version-script: pnpm changeset version
          publish-script: pnpm changeset publish
          commit-message: "Version packages"
          pr-title: "Version packages"
          github-token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          # Optional. Preferred setup is npm trusted publishing (OIDC), which
          # needs no stored credential at all — configure it per package in the
          # npm UI and this can stay empty. Kept as a fallback because trusted
          # publishing has to be enabled on a package that already exists.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # Opening the pull request is the one thing this job cannot do for
      # itself. `pull-requests: write` above is declared and then overridden by
      # a repository switch — Settings -> Actions -> General -> Workflow
      # permissions -> "Allow GitHub Actions to create and approve pull
      # requests" — so the run versions every package correctly and fails on
      # the final API call.
      #
      # Pushing a branch needs only `contents: write`, which this job has. So
      # the branch is pushed and the summary carries a one-click link to open
      # the PR from it. The release model is unchanged: a human reviews the
      # bumps, and merging is still the only thing that publishes. Enabling the
      # switch, or adding a RELEASE_PAT, skips this entirely.
      - name: Push the Version branch when Actions may not open the PR
        if: steps.changesets.outcome == 'failure'
        env:
          BRANCH: changeset-release/main
        run: |
          set -euo pipefail

          # Only the PR-permission case is recoverable. A commit carrying no
          # changesets means the action was trying to *publish*, and a publish
          # that failed must stay failed rather than be dressed up as a link.
          #
          # Read from the commit, never from the working tree. `changeset
          # version` deletes each changeset as it consumes it, and it does that
          # *before* the call that opens the pull request — so by the time this
          # step runs the directory is empty whether or not there was anything
          # to release. Checking the tree reported "no changesets pending" on a
          # run with sixteen of them, and turned a recoverable state into a red
          # build carrying a message that pointed at the wrong thing entirely.
          #
          # `git ls-tree` reads the immutable commit, so nothing the previous
          # step did can change the answer.
          pending=$(git ls-tree -r --name-only "$GITHUB_SHA" -- .changeset \
            | grep -viE 'config\.json|README\.md' | head -1)
          if [ -z "$pending" ]; then
            echo "::error::The release step failed and this commit carries no changesets, so it was publishing rather than versioning. Read the log above."
            exit 1
          fi

          # A clean slate. The action may have versioned and committed before
          # it failed, and running `changeset version` over that would double
          # every bump.
          git reset --hard "$GITHUB_SHA"
          git switch -C "$BRANCH"

          pnpm changeset version

          git add -A
          # --no-verify as well as HUSKY=0: this commit is machine-generated from
          # changesets output, and every gate those hooks would run has already run
          # against the whole repository earlier in this job.
          #
          # The message is conventional so the history stays readable, and so this
          # does not depend on hooks being off in order to be valid.
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --no-verify -m "chore(release): version packages"
          git push --force origin "$BRANCH"

          compare="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
          {
            echo "### The Version PR is ready to open"
            echo
            echo "GitHub Actions is not permitted to open pull requests in this"
            echo "repository, so the versioned branch has been pushed instead."
            echo
            echo "**[Open the Version PR](${compare})** — review the bumps and the"
            echo "changelogs, then merge it. Merging is what publishes, exactly as before."
            echo
            echo "To have it opened automatically in future, either tick *Settings ->"
            echo "Actions -> General -> Workflow permissions -> Allow GitHub Actions to"
            echo "create and approve pull requests*, or add a \`RELEASE_PAT\` secret with"
            echo "\`repo\` scope — this workflow already prefers the PAT when present."
            echo
            echo "Nothing was published by this run."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice::Version branch pushed. Open the PR: ${compare}"
