# Static analysis.
#
# There was none. For a library that will be installed into software handling
# patient data, "we run ESLint" is not an answer to a vendor security
# questionnaire; a CodeQL result set is.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published query finds old code without waiting for a
    # commit that happens to touch it.
    - cron: "17 4 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Skipped rather than failed while this repository cannot run it.
    #
    # Uploading CodeQL results needs code scanning enabled, and on a **private**
    # repository that needs GitHub Advanced Security — which is not available on
    # a personal account. So on this repo today the analysis runs for four
    # minutes and then dies on the upload:
    #
    #   Code scanning is not enabled for this repository.
    #
    # Leaving that red is worse than not running it. A check that is always
    # failing is a check everybody learns to scroll past, and the next failure —
    # a real one — scrolls past with it. The same reasoning already keeps the
    # darwin VRT baselines out of CI, and it is written up there too.
    #
    # This arms itself with no further action in either of the two ways it can
    # become available:
    #
    #   - the repository goes public, which is Phase 5 of the readiness roadmap
    #     and makes code scanning free;
    #   - or someone enables Advanced Security and sets the repository variable
    #     ENABLE_CODEQL to "true".
    #
    # Until then `pnpm audit`, the dependency-cruiser layer rules, and the
    # `no-forbidden-capability` lint rule are what stand in for it, and §14 of
    # the audit says so rather than implying coverage this does not have.
    if: github.event.repository.private == false || vars.ENABLE_CODEQL == 'true'

    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          # `languages`, plural. The singular is not an input this action has;
          # it was accepted without complaint and ignored, so the matrix value
          # selected nothing and CodeQL fell back to autodetecting. actionlint
          # reports it as an unknown input, which is how it was found.
          languages: ${{ matrix.language }}
          # security-extended adds the queries that matter for a library:
          # injection sinks, unsafe deserialisation, prototype pollution.
          queries: security-extended

      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v3
        with:
          category: "/language:${{ matrix.language }}"
