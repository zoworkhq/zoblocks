# Static analysis.
#
# There was none. For a library that will be installed into software handling
# patient data, "we run ESLint" is not an answer to a vendor security
# questionnaire; a CodeQL result set is.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published query finds old code without waiting for a
    # commit that happens to touch it.
    - cron: "17 4 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
          # security-extended adds the queries that matter for a library:
          # injection sinks, unsafe deserialisation, prototype pollution.
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
