name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, never a run that is mid-deploy on main. Two
  # merges in quick succession used to cancel the first one's `vercel deploy`.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege. There was no permissions block, so every job inherited the
# repository default while running `pnpm dlx` on network-fetched code. Jobs that
# need more than read declare it themselves.
permissions:
  contents: read

# Identifiers, not credentials — they appear in .vercel/project.json on every
# machine that has ever run `vercel link`. The only secret is VERCEL_TOKEN.
env:
  VERCEL_ORG_ID: team_ykOxK7PvNXML8d1afzA5dfNP
  VERCEL_PROJECT_ID_DOCS: prj_mdPnSKVCxN5nwG1XZrHDBrBHYOQq

  # Where mongodb-memory-server keeps its mongod, for hq's tests. Set here
  # rather than left to default because the library resolves the directory from
  # the working directory: `pnpm install` runs at the root and `turbo run test`
  # runs in apps/hq, so the default has them disagree and fetch it twice. One
  # fixed path is also the only thing actions/cache can be pointed at.
  MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries

  # Turbo's cache location, pinned so there is a single directory to restore.
  #
  # This is load-bearing and easy to get wrong: by default Turbo does NOT keep
  # a central cache. It writes per-package `.turbo/` directories, and for a task
  # with no declared `outputs` it keeps only the task log. Caching the root
  # `.turbo` therefore captures run summaries and nothing else — a cache step
  # that is green, fast, and does nothing at all.
  #
  # Verified rather than assumed: with this set, `turbo run build` writes
  # `<hash>.tar.zst` artifacts here, and deleting `dist` then re-running
  # restores it and reports FULL TURBO.
  TURBO_CACHE_DIR: ${{ github.workspace }}/.turbo/cache

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    # This one job does everything: install, generate, lint, format, typecheck,
    # the unit suites, the same suites again under coverage, every build, the
    # axe audit over sixteen pages in two themes, and the browser suite in
    # three engines. Fifteen minutes fitted that when the catalog had six
    # components; it now has twelve, plus three package families that did not
    # exist. The run that prompted this was killed mid-e2e at 15m16s with
    # nothing failing — a timeout reported as a test failure, which is the most
    # expensive kind of red.
    #
    # Deliberately not fixed by dropping the separate `Test` step: eight
    # packages define `test` without `test:coverage`, so the coverage run does
    # not cover them and removing it would quietly stop running their suites.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # hq's tests run against a real mongod, fetched by mongodb-memory-server's
      # postinstall. Restored before install so the postinstall finds it, and so
      # a bad day at the download host cannot fail an otherwise-green build.
      - name: Cache mongod binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/.cache/mongodb-binaries
          key: mongod-${{ runner.os }}-7.0.24

      # Turbo's local cache, carried between runs.
      #
      # `turbo.json` has declared correct `outputs` for build, test and
      # test:coverage all along, so the task graph was always cacheable — there
      # was simply nothing persisting it, and every run recomputed typecheck
      # (123s), test (227s), coverage (208s) and build (74s) from cold,
      # including for a pull request that changed one markdown file.
      #
      # The key is content, not branch. Turbo hashes each task's own inputs, so
      # a restored cache cannot produce a stale result: changed input, changed
      # hash, cache miss. The lockfile is in the key because a dependency change
      # invalidates everything downstream of it, and the SHA makes each run
      # write a fresh entry rather than fight another run for one. The prefixes
      # are what actually deliver the hits.
      #
      # Deliberately not keyed on branch name alone — that is how a cache entry
      # for one set of inputs gets served for another.
      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/.turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      # Runs before anything else. It validates every component's metadata,
      # typechecks the source customers receive, and produces every derived
      # artifact. A registry that does not validate is a broken install for
      # every customer, and this is the cheapest check we have.
      #
      # `--strict` additionally fails when a component does not meet the bar for
      # The catalog quality gate, armed.
      #
      # `--strict` makes a component that does not meet the bar for its declared
      # stability tier a build failure rather than a warning. It stayed off
      # because `withStory` was 0 and every component would have failed; stories
      # now exist for all five, and coverage.json reports withStory: 5.
      #
      # This is what makes the standard hold without a human reviewing every
      # component: a beta component without a story, or a stable one without
      # limitations or extracted props, cannot merge.
      - name: Generate and enforce the catalog quality gate
        run: pnpm gen --strict

      # Some generated artifacts are committed (registry.json, path mappings,
      # the docs catalog) and some are build output (apps/docs/public/r/*.json,
      # which .gitignore excludes). `git diff` is the check that covers exactly
      # the committed ones, without the generator needing to know which is
      # which. `pnpm gen:check` is the equivalent locally.
      - name: No stale generated files
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::Generated files are stale. Run \`pnpm gen\` and commit the result."
            exit 1
          fi

      # `pnpm lint` carries a --max-warnings ratchet set to the exact count on
      # the day lint was introduced, so the gate is identical here and on a
      # developer's machine. Two rules are staged as warnings rather than errors
      # — logical properties, and reading the clock inside a component —
      # because the existing catalog violates them, and promoting them straight
      # to errors would have meant either a large refactor in the same change or
      # a blanket suppression.
      #
      # The number may go down. It may not go up: a new warning fails the build,
      # so adding one means fixing it, or fixing another to make room. When it
      # reaches zero, both rules become errors and the flag goes away.
      # A high-or-worse advisory in the toolchain fails the build rather than
      # waiting for a procurement reviewer to run it. (The threshold is `high`,
      # not `critical` — the comment used to say critical, which understated
      # what this actually enforces.)
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Lint
        run: pnpm lint

      # Formatting was checkable but never checked, so it drifted to 65 files.
      # Generated artifacts are excluded in .prettierignore rather than
      # formatted: Prettier would reformat them, the next `pnpm gen` would
      # write them back, and the stale-generated-files check above would fail
      # on a diff nobody made. The generators own their own output shape.
      - name: Format
        run: pnpm format:check

      # Covers the registry component source — the exact files copied into a
      # customer's project. Nothing used to typecheck them: the root config that
      # includes them was not part of any workspace task, and four components
      # had unresolvable imports that no job reported.
      - name: Typecheck
        run: pnpm typecheck

      # One instrumented run, not two.
      #
      # This was `Test` (227s) followed by `Coverage thresholds` (208s), which
      # executed substantially the same suites twice — 41% of the whole build.
      # The obvious fix was wrong for a long time and the workflow said so:
      # eight packages defined `test` without `test:coverage`, so dropping the
      # first step would have silently stopped running them.
      #
      # Those eight now define both, so `test:coverage` is a strict superset.
      # Verified by comparing per-package suite counts across the two commands
      # before the step was removed: 20 packages and 2768 tests under each,
      # with no package present in one and absent from the other.
      #
      # Two layers still run, and both must pass:
      #
      #   `turbo run test:coverage` — the workspace packages and hq's auth,
      #                        permissions and server actions, the last against
      #                        a real mongod rather than a mocked driver: the
      #                        guarantees there (a unique index deciding a
      #                        duplicate signup, an atomic claim deciding who is
      #                        the first admin) live in the database, so a mock
      #                        would assert the code calls what it calls.
      #   `vitest run --coverage` — the registry components, rendered in jsdom
      #                        against the source a customer actually receives.
      #
      # Every component asserts the safety claim it exists to make: an
      # uninterpreted result never reads as normal, a comparator survives, an
      # unknown code status never defaults to full code, a restricted record
      # fails closed. Those are the failures that look fine in review.
      #
      # Coverage is a gate, not a report. The readiness audit's tier bar puts
      # `beta` at 90% lines / 85% branches, and a package that declares
      # thresholds fails its own run when it slips below.
      - name: Coverage thresholds
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      # The site claims WCAG 2.2 AA and publishes per-component accessibility
      # notes. This is what makes that claim checkable rather than aspirational.
      # Its first run found four real violations, including a contrast failure
      # on the footer's own legal limitation statement and three in the
      # clinical status tokens.
      # Browser binaries are ~300MB and took 71s to fetch on every single run.
      # Keyed on the resolved Playwright version rather than the lockfile hash,
      # so an unrelated dependency bump does not throw the browsers away.
      - name: Resolve the Playwright version
        id: pw
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Playwright $version"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Firefox and WebKit as well as Chromium: the library publishes a WCAG
      # 2.2 AA claim, and a focus ring or a forced-colours fallback that works
      # in one engine and not another is exactly the defect that claim hides.
      #
      # Two steps, because only one half is cacheable. The browsers live in the
      # cached directory; `--with-deps` installs OS packages system-wide, which
      # a cache cannot hold, and which are cheap.
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium firefox webkit

      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chromium firefox webkit

      # The server plumbing lives in scripts/verify-a11y.sh so this and
      # `pnpm verify --ci` run the same code. The site publishes a WCAG 2.2 AA
      # conformance claim; this is what makes it checkable rather than
      # aspirational, and its first run found four real violations including a
      # contrast failure on the footer's own legal limitation statement.
      - name: Accessibility (WCAG 2.2 AA, both themes)
        run: bash scripts/verify-a11y.sh

      # Visual regression, plus the accessibility checks that need a real layout
      # engine: 320px reflow, 200% zoom, forced colours, the focus indicator,
      # and the reduced-motion still state. jsdom can see none of those.
      # `e2e:ci` deliberately excludes the @vrt tag.
      #
      # Screenshot baselines are platform-specific — the committed set is
      # darwin, and font rasterisation alone makes them fail on linux. Running
      # them here would make a new gate red on its first run, which is how a
      # team learns to ignore a gate. The browser-level accessibility checks
      # (reflow, zoom, forced colours, focus, reduced motion) are
      # platform-independent and run here.
      #
      # To make VRT blocking in CI, generate linux baselines once inside the
      # official Playwright container and commit them:
      #   docker run --rm -v "$PWD:/w" -w /w mcr.microsoft.com/playwright:v1.56.0-jammy \
      #     sh -c "corepack enable && pnpm i --frozen-lockfile && pnpm build && pnpm e2e:update"
      # then swap this step for `pnpm e2e`.
      #
      # This step also runs the @framework suite: six applications in
      # apps/smoke and apps/smoke-react18, one per supported framework, each
      # built by that framework's own compiler and driven through an identical
      # script in all three engines. Playwright's webServer config builds and
      # serves them, so no extra step is needed here — and the build itself is
      # half the test, since Angular and Vue reject bad markup at compile time.
      # Its first run found the elements broken in React 19, Vue, and Angular.
      #
      # `OXYGEN_BASE_URL` is deliberately NOT set here.
      #
      # Setting it tells playwright.config.ts to skip starting the docs server,
      # on the assumption that one is already running — which used to be true by
      # accident: the accessibility step above started a server with `&` and
      # never stopped it, and this step inherited it. Moving that step into a
      # script that cleans up after itself broke the assumption, and every
      # browser test failed with ERR_CONNECTION_REFUSED.
      #
      # Unset, Playwright starts and stops its own server, which is what makes
      # this step self-contained rather than dependent on a leak two steps
      # earlier.
      - name: Browser accessibility and cross-framework smoke
        run: pnpm e2e:ci

      # A retried-but-passed test leaves no signal anyone reads: the job is
      # green and the retry is buried in the log. `always()` because a flake is
      # most worth reporting on the run where something else also failed.
      - name: Report flaky tests
        if: always()
        run: node scripts/flaky.mjs

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # Budgets on the bytes a customer installs. ENGINEERING.md §11.
      - name: Bundle budgets
        run: pnpm size

      # The layer rule from ARCHITECTURE.md §2, executable rather than written
      # down. Also catches cycles and a devDependency reaching shipped source.
      - name: Architecture rules
        run: pnpm deps

  no-phi:
    name: Synthetic data check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fixtures must stay synthetic. This catches the obvious mistakes — a real
      # identifier system, a production hostname — not every possible one. It is
      # a backstop for review, not a substitute for it.
      #
      # The bare acronym "PHI" used to be in this pattern. It matched our own
      # prose explaining the PHI policy — in the fixtures header, on the
      # homepage, in component documentation — so the job was red on every
      # commit and told us nothing. A check that always fails is a check nobody
      # reads. Patterns here must match DATA, never discussion of data.
      # The patterns live in scripts/no-phi.sh so this and `pnpm verify` run
      # identical code. Inline here, it was a CI-only gate — a developer could
      # not run it without copying shell out of a YAML file, so nobody did, and
      # it could only ever fail after a push.
      - name: Scan for non-synthetic identifiers
        run: bash scripts/no-phi.sh

  # ---------------------------------------------------------------------------
  # Deployment
  #
  # Deliberately GitHub Actions rather than Vercel's own Git integration. That
  # integration deploys on every push whether or not the checks passed — which
  # for a site publishing WCAG conformance and healthcare component guidance is
  # the wrong default. `needs:` makes a green build a precondition, not a
  # parallel opinion.
  #
  # It also removes the failure mode this replaced: deploys ran from a laptop
  # via `vercel --prod`, against whatever branch happened to be checked out.
  # Production sat three merges stale because the working copy was on a feature
  # branch. CI has no checkout to get wrong.
  # ---------------------------------------------------------------------------
  deploy-docs:
    name: Deploy docs (production)
    needs: [verify, no-phi]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://oxygenui.design

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Deploy
        env:
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID_DOCS }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN is not set. Add it under Settings → Secrets → Actions."
            exit 1
          fi
          pnpm dlx vercel@48 pull --yes --environment=production --token "$VERCEL_TOKEN"
          pnpm dlx vercel@48 build --prod --token "$VERCEL_TOKEN"
          url=$(pnpm dlx vercel@48 deploy --prebuilt --prod --token "$VERCEL_TOKEN")
          echo "Deployed: $url"
          echo "### Docs deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      # The registry is the contract customers install against. A deploy that
      # returns 200 but serves a stale or malformed registry is a broken
      # install for everyone, and it is exactly what went unnoticed for three
      # merges. Assert the deployed artifact, not just the response code.
      # Verifies the deployed registry against what this commit actually built,
      # rather than against a component named here. The previous version fetched
      # `vitals-panel.json` by name; when that component was removed the gate
      # kept asking for it, so the next merge to main would have failed on a
      # component that was deliberately deleted. A gate must not carry its own
      # expiry date.
      - name: Verify the deployed registry
        run: |
          set -euo pipefail
          expected=$(node -e 'process.stdout.write(require("./registry.json").items.map(i=>i.name).sort().join(","))')
          echo "Expecting: $expected"

          url="https://oxygenui.design/r/index.json?ci=${GITHUB_SHA}"
          # `_` rather than `i`: the counter bounds the loop and is never
          # read, and shellcheck is right to say so.
          for _ in $(seq 1 10); do
            body=$(curl -fsS --max-time 20 "$url" || true)
            if [ -n "$body" ]; then break; fi
            sleep 6
          done

          if [ -z "$body" ]; then
            echo "::error::Deployed registry index was unreachable after 10 attempts."
            exit 1
          fi

          echo "$body" | EXPECTED="$expected" node -e '
            const served = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const names = (served.items ?? []).map((i) => i.name).sort().join(",");
            if (names !== process.env.EXPECTED) {
              console.error("::error::Deployed registry does not match this build.");
              console.error("  built:  " + process.env.EXPECTED);
              console.error("  served: " + names);
              process.exit(1);
            }
            console.log("Registry verified: " + (served.items ?? []).length + " items served");
          '

  # hq is a separate Vercel project. The job self-skips until VERCEL_PROJECT_ID_HQ
  # exists as a repository variable, so this workflow is committable before the
  # project is created rather than red until someone gets to it.
  #
  # The skip is a JOB condition, not a per-step one.
  #
  # It used to be five steps each guarded by `steps.gate.outputs.skip`, and no
  # step declared `id: gate` — so the expression read an empty string, every
  # guarded step skipped, and GitHub reported the job as *successful* because a
  # job whose steps all skip is a job that passed. hq was never deployed and
  # the pipeline said it was, including the post-deploy assertion that would
  # have noticed.
  #
  # At job level GitHub reports the job as *skipped*, which is honest by
  # construction and cannot be misread as a deploy. `actionlint` in the lint
  # gate now catches the original mistake — an unresolvable `steps.*` reference
  # is a static error, and it flagged all five the first time it ran.
  deploy-hq:
    name: Deploy hq (production)
    needs: [verify, no-phi]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.VERCEL_PROJECT_ID_HQ != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-hq
      url: https://hq.oxygenui.design

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Deploy
        env:
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_HQ }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # The token is passed with --token on every call. The CLI does not
          # read VERCEL_TOKEN from the environment for these commands, and
          # relying on that produced "No existing credentials found" with the
          # secret correctly set — a failure that reads like a missing secret
          # and is not one.
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN is not set. Add it under Settings → Secrets → Actions."
            exit 1
          fi
          pnpm dlx vercel@48 pull --yes --environment=production --token "$VERCEL_TOKEN"
          pnpm dlx vercel@48 build --prod --token "$VERCEL_TOKEN"
          url=$(pnpm dlx vercel@48 deploy --prebuilt --prod --token "$VERCEL_TOKEN")
          echo "Deployed: $url"

      # Asserted against the custom domain only when it is actually attached.
      # It was hard-coded, so a successful deploy failed here with curl exit 6 —
      # host not found — reported as though hq were broken when hq was fine and
      # the domain simply had not been moved onto the project yet. A check that
      # fails for a reason outside what it is checking teaches people to ignore
      # it.
      - name: Verify hq is serving hq
        run: |
          set -uo pipefail
          host=hq.oxygenui.design

          if ! getent hosts "$host" >/dev/null 2>&1 && ! host "$host" >/dev/null 2>&1; then
            echo "$host does not resolve yet — domain not attached to this project. Skipping the check." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Signed out, hq must redirect to its own sign-in rather than render.
          # A wrong Root Directory would serve the marketing site from this
          # hostname, and the redirect is what distinguishes them.
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://$host/tasks")
          if [ "$code" != "307" ] && [ "$code" != "302" ]; then
            echo "::error::https://$host/tasks returned $code, expected a redirect to sign-in. Check the project Root Directory is apps/hq."
            exit 1
          fi
          echo "hq responded $code — signed-out redirect intact."

  # Preview per pull request. Same build path as production, so a PR that
  # deploys is a PR that can be looked at rather than imagined.
  deploy-preview:
    name: Deploy docs (preview)
    needs: [verify, no-phi]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Deploy preview
        env:
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID_DOCS }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            # Fork PRs never receive secrets, so this is the normal path for an
            # outside contribution. Say so plainly instead of reporting a green
            # "deployed" that deployed nothing.
            echo "### Preview skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "No \`VERCEL_TOKEN\` in this context — expected on a fork PR. A maintainer preview runs after review." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Preview deployment skipped: no VERCEL_TOKEN (expected on fork PRs)."
            exit 0
          fi
          pnpm dlx vercel@48 pull --yes --environment=preview --token "$VERCEL_TOKEN"
          pnpm dlx vercel@48 build --token "$VERCEL_TOKEN"
          url=$(pnpm dlx vercel@48 deploy --prebuilt --token "$VERCEL_TOKEN")
          echo "### Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
