# actionlint knows only GitHub-hosted runner labels. A label for our own
# self-hosted runners has to be declared here, or `pnpm lint:actions` fails
# on every workflow that uses it.
self-hosted-runner:
  labels:
    # The AWS EC2 runners (`runner_extra_labels`). Only test-spot-runner.yml
    # uses it while the repository is public. See "CI runners" in DEPLOYMENT.md.
    - on-demand
