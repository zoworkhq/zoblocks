# Dependency updates.
#
# The repository had none, and a critical advisory sat in the toolchain until an
# audit found it by hand. `pnpm audit --audit-level=high` in CI is the gate;
# this is what keeps the gate from firing in the first place.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # One PR per family rather than twenty. A grouped update either passes the
      # full gate set or it does not, which is the only question worth asking.
      typescript-eslint:
        patterns: ["@typescript-eslint/*", "typescript-eslint", "eslint*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      testing-library:
        patterns: ["@testing-library/*"]
      next:
        patterns: ["next", "@next/*", "eslint-config-next"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      playwright:
        patterns: ["@playwright/*", "playwright*"]
    ignore:
      # React major bumps change the peer range on a published package. That is
      # a deliberate decision with a migration note, never an automated PR.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
